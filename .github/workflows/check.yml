name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --no-update-lock-file --print-build-logs
      - name: Test daemon-backed task realisation
        run: >-
          nix develop --command nu --no-config-file
          tests/consumer/native-task-lifecycle.nu
          "$PWD" "$RUNNER_TEMP/nu-nix-native-task"
      - name: Test real profile lifecycle
        run: >-
          nix develop --command nu --no-config-file
          tests/consumer/profile-lifecycle.nu
          "$PWD" "$RUNNER_TEMP/nu-nix-profile"
